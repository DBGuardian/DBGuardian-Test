spring:
  datasource:
    master:
      url: jdbc:h2:mem:jdbc_mariadb_java11_master;MODE=MariaDB;DB_CLOSE_DELAY=-1
      driver-class-name: org.h2.Driver
      username: sa
      password: ''
    slave:
      url: jdbc:h2:mem:jdbc_mariadb_java11_slave;MODE=MariaDB;DB_CLOSE_DELAY=-1
      driver-class-name: org.h2.Driver
      username: sa
      password: ''
    runtime:
      periodic-health-check-enabled: false
    recovery:
      enabled: false
  redis:
    host: 127.0.0.1
    port: 1
    connect-timeout: 100ms
    timeout: 100ms
