spring:
  application:
    name: dbguardian-test-java8-sb27-mybatis-pg

  datasource:
    master:
      url: ${DBGUARDIAN_DB_MASTER_URL:jdbc:postgresql://127.0.0.1:5432/dbguardian_master}
      username: ${DBGUARDIAN_DB_MASTER_USERNAME:}
      password: ${DBGUARDIAN_DB_MASTER_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 10000
        idle-timeout: 300000
        max-lifetime: 600000
    slave:
      url: ${DBGUARDIAN_DB_SLAVE_URL:jdbc:postgresql://127.0.0.1:5433/dbguardian_slave}
      username: ${DBGUARDIAN_DB_SLAVE_USERNAME:}
      password: ${DBGUARDIAN_DB_SLAVE_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 10000
        idle-timeout: 300000
        max-lifetime: 600000
    replication:
      master-host: ${DBGUARDIAN_REPLICATION_HOST:127.0.0.1}
      master-port: ${DBGUARDIAN_REPLICATION_PORT:5432}
      master-user: ${DBGUARDIAN_REPLICATION_USER:}
      master-password: ${DBGUARDIAN_REPLICATION_PASSWORD:}
      auto-reconnect: true
    recovery:
      enabled: true
      auto-failback: true
      catchup-timeout-seconds: 30
      catchup-check-interval-seconds: 1
      postgresql:
        enabled: true
        data-directory: /var/lib/postgresql/data
        remote-execution-enabled: false
        pg-ctl-command: pg_ctl
        psql-command: psql
        pg-rewind-command: pg_rewind
        local-host: ${DBGUARDIAN_PG_LOCAL_HOST:127.0.0.1}
        local-port: ${DBGUARDIAN_PG_LOCAL_PORT:5432}
        local-database: ${DBGUARDIAN_PG_LOCAL_DATABASE:dbguardian_master}
        primary-slot-name: dbguardian_slot
        startup-wait-seconds: 10
        command-timeout-seconds: 30
    allow-degraded-startup: true

  redis:
    host: ${DBGUARDIAN_REDIS_HOST:127.0.0.1}
    port: ${DBGUARDIAN_REDIS_PORT:6379}
    password: ${DBGUARDIAN_REDIS_PASSWORD:}
    database: ${DBGUARDIAN_REDIS_DATABASE:1}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: 1000ms
        max-idle: 2
        min-idle: 1

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.dbguardian.test.entity

logging:
  level:
    root: INFO
    com.dbguardian.test: DEBUG
    io.dbguardian: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"