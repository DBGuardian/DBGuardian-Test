spring:
  application:
    name: dbguardian-test-java8-sb27-mbp-pg

  # PostgreSQL 主库数据源配置（测试环境）
  datasource:
    master:
      url: ${DBGUARDIAN_DB_MASTER_URL:jdbc:postgresql://127.0.0.1:5432/dbguardian_master}
      username: ${DBGUARDIAN_DB_MASTER_USERNAME:}
      password: ${DBGUARDIAN_DB_MASTER_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 10000
        idle-timeout: 300000
        max-lifetime: 600000
    # PostgreSQL 从库数据源配置
    slave:
      url: ${DBGUARDIAN_DB_SLAVE_URL:jdbc:postgresql://127.0.0.1:5433/dbguardian_slave}
      username: ${DBGUARDIAN_DB_SLAVE_USERNAME:}
      password: ${DBGUARDIAN_DB_SLAVE_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 10000
        idle-timeout: 300000
        max-lifetime: 600000
    # PostgreSQL 复制观测配置
    replication:
      master-host: ${DBGUARDIAN_REPLICATION_HOST:127.0.0.1}
      master-port: ${DBGUARDIAN_REPLICATION_PORT:5432}
      master-user: ${DBGUARDIAN_REPLICATION_USER:}
      master-password: ${DBGUARDIAN_REPLICATION_PASSWORD:}
      auto-reconnect: true
    # 允许降级启动
    allow-degraded-startup: true

  # Redis配置（测试环境）
  redis:
    host: ${DBGUARDIAN_REDIS_HOST:127.0.0.1}
    port: ${DBGUARDIAN_REDIS_PORT:6379}
    password: ${DBGUARDIAN_REDIS_PASSWORD:}
    database: ${DBGUARDIAN_REDIS_DATABASE:1}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: 1000ms
        max-idle: 2
        min-idle: 1

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.dbguardian.test.entity

# 日志配置
logging:
  level:
    root: INFO
    com.dbguardian.test: DEBUG
    io.dbguardian: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
