server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: dbguardian-test-java8-sb27-mbp-pg

  # 允许循环依赖（DBGuardian 与 MyBatis-Plus 的数据源配置循环）
  main:
    allow-circular-references: true

  # MVC配置
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # PostgreSQL 主库数据源配置
  datasource:
    master:
      url: ${DBGUARDIAN_DB_MASTER_URL:jdbc:postgresql://127.0.0.1:5432/appdb}
      username: ${DBGUARDIAN_DB_MASTER_USERNAME:}
      password: ${DBGUARDIAN_DB_MASTER_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    # PostgreSQL 从库数据源配置
    slave:
      url: ${DBGUARDIAN_DB_SLAVE_URL:jdbc:postgresql://127.0.0.1:5433/appdb}
      username: ${DBGUARDIAN_DB_SLAVE_USERNAME:}
      password: ${DBGUARDIAN_DB_SLAVE_PASSWORD:}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    # PostgreSQL 复制观测配置
    replication:
      master-host: ${DBGUARDIAN_REPLICATION_HOST:127.0.0.1}
      master-port: ${DBGUARDIAN_REPLICATION_PORT:5432}
      master-user: ${DBGUARDIAN_REPLICATION_USER:}
      master-password: ${DBGUARDIAN_REPLICATION_PASSWORD:}
      auto-reconnect: true
    # PostgreSQL 自动追赶配置
    recovery:
      enabled: true
      auto-failback: true
      catchup-timeout-seconds: 300
      catchup-check-interval-seconds: 2
      postgresql:
        enabled: true
        keep-promoted-primary: false
        data-directory: /var/lib/postgresql/16/main
        config-file: /etc/postgresql/16/main/postgresql.conf
        script-path: /opt/dbguardian/scripts/pg-rewind-recover.sh
        remote-execution-enabled: true
        remote-executor-command: ${DBGUARDIAN_PG_REMOTE_EXECUTOR_COMMAND:}
        remote-executor-password: ${DBGUARDIAN_PG_REMOTE_EXECUTOR_PASSWORD:}
        pg-ctl-command: /usr/lib/postgresql/16/bin/pg_ctl
        psql-command: /usr/lib/postgresql/16/bin/psql
        pg-rewind-command: /usr/lib/postgresql/16/bin/pg_rewind
        local-host: ${DBGUARDIAN_PG_LOCAL_HOST:127.0.0.1}
        local-port: ${DBGUARDIAN_PG_LOCAL_PORT:5432}
        local-database: ${DBGUARDIAN_PG_LOCAL_DATABASE:appdb}
        primary-slot-name: appdb_slot
        extra-primary-conn-info: ${DBGUARDIAN_PG_EXTRA_PRIMARY_CONN_INFO:}
        startup-wait-seconds: 60
        command-timeout-seconds: 900
        failback-data-directory: /var/lib/postgresql/16/main
        failback-config-file: /etc/postgresql/16/main/postgresql.conf
        failback-script-path: /opt/dbguardian/scripts/pg-rewind-recover.sh
        failback-remote-execution-enabled: true
        failback-remote-executor-command: ${DBGUARDIAN_PG_FAILBACK_REMOTE_EXECUTOR_COMMAND:}
        failback-remote-executor-password: ${DBGUARDIAN_PG_FAILBACK_REMOTE_EXECUTOR_PASSWORD:}
        failback-pg-ctl-command: /usr/lib/postgresql/16/bin/pg_ctl
        failback-psql-command: /usr/lib/postgresql/16/bin/psql
        failback-pg-rewind-command: /usr/lib/postgresql/16/bin/pg_rewind
        failback-local-host: ${DBGUARDIAN_PG_FAILBACK_LOCAL_HOST:127.0.0.1}
        failback-local-port: ${DBGUARDIAN_PG_FAILBACK_LOCAL_PORT:5432}
        failback-local-database: ${DBGUARDIAN_PG_FAILBACK_LOCAL_DATABASE:appdb}
        failback-primary-slot-name: appdb_slot
        failback-extra-primary-conn-info: ${DBGUARDIAN_PG_FAILBACK_EXTRA_PRIMARY_CONN_INFO:}
        failback-command-timeout-seconds: 900

    # 降级启动配置
    allow-degraded-startup: true

  # Redis配置（用于协调服务）
  redis:
    host: ${DBGUARDIAN_REDIS_HOST:127.0.0.1}
    port: ${DBGUARDIAN_REDIS_PORT:6379}
    password: ${DBGUARDIAN_REDIS_PASSWORD:}
    database: ${DBGUARDIAN_REDIS_DATABASE:0}
    timeout: 10000ms
    lettuce:
      pool:
        max-active: 20
        max-wait: 3000ms
        max-idle: 5
        min-idle: 1

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.dbguardian.test.entity

# Knife4j配置
knife4j:
  enable: true
  openapi:
    title: DBGuardian PostgreSQL 测试项目 API 文档
    description: 用于测试 PostgreSQL 读写分离功能
    version: 1.0.0

# 日志配置
logging:
  level:
    root: INFO
    com.dbguardian.test: DEBUG
    io.dbguardian: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
