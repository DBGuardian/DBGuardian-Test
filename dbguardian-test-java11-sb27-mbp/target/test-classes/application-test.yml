server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: dbguardian-test-java11-sb27-mbp

  # 允许循环依赖（DBGuardian 与 MyBatis-Plus 的数据源配置循环）
  main:
    allow-circular-references: true

  # MVC配置
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # 主库数据源配置（测试环境）
  datasource:
    master:
      url: ${DBGUARDIAN_DB_MASTER_URL:jdbc:mysql://127.0.0.1:3306/dbguardian_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      username: ${DBGUARDIAN_DB_MASTER_USERNAME:}
      password: ${DBGUARDIAN_DB_MASTER_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 10000
        idle-timeout: 300000
        max-lifetime: 600000
    # 从库数据源配置
    slave:
      url: ${DBGUARDIAN_DB_SLAVE_URL:jdbc:mysql://127.0.0.1:3307/dbguardian_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      username: ${DBGUARDIAN_DB_SLAVE_USERNAME:}
      password: ${DBGUARDIAN_DB_SLAVE_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 5
        minimum-idle: 1
        connection-timeout: 10000
        idle-timeout: 300000
        max-lifetime: 600000
    # 主从复制配置
    replication:
      master-host: ${DBGUARDIAN_REPLICATION_HOST:127.0.0.1}
      master-port: ${DBGUARDIAN_REPLICATION_PORT:3306}
      master-user: ${DBGUARDIAN_REPLICATION_USER:}
      master-password: ${DBGUARDIAN_REPLICATION_PASSWORD:}
      auto-reconnect: true
    # 允许降级启动
    allow-degraded-startup: true

  # Redis配置（测试环境）
  redis:
    host: ${DBGUARDIAN_REDIS_HOST:127.0.0.1}
    port: ${DBGUARDIAN_REDIS_PORT:6379}
    password: ${DBGUARDIAN_REDIS_PASSWORD:}
    database: ${DBGUARDIAN_REDIS_DATABASE:1}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: 1000ms
        max-idle: 2
        min-idle: 1

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.test.entity

# Knife4j配置
knife4j:
  enable: true
  openapi:
    title: DBGuardian 测试项目API文档
    description: 用于测试读写分离功能
    version: 1.0.0

# 日志配置
logging:
  level:
    root: INFO
    com.test: DEBUG
    io.dbguardian: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
