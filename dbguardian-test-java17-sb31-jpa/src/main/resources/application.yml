server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: dbguardian-test-java17-sb31-jpa

  # DBGuardian 路由数据源与 JPA 自动配置之间存在依赖关系。
  main:
    allow-circular-references: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  datasource:
    master:
      url: ${DBGUARDIAN_DB_MASTER_URL:jdbc:mysql://127.0.0.1:3306/dbguardian_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      username: ${DBGUARDIAN_DB_MASTER_USERNAME:}
      password: ${DBGUARDIAN_DB_MASTER_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    slave:
      url: ${DBGUARDIAN_DB_SLAVE_URL:jdbc:mysql://127.0.0.1:3307/dbguardian_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      username: ${DBGUARDIAN_DB_SLAVE_USERNAME:}
      password: ${DBGUARDIAN_DB_SLAVE_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
    replication:
      master-host: ${DBGUARDIAN_REPLICATION_HOST:127.0.0.1}
      master-port: ${DBGUARDIAN_REPLICATION_PORT:3306}
      master-user: ${DBGUARDIAN_REPLICATION_USER:}
      master-password: ${DBGUARDIAN_REPLICATION_PASSWORD:}
      auto-reconnect: true
    allow-degraded-startup: true

  data:
    redis:
      host: ${DBGUARDIAN_REDIS_HOST:127.0.0.1}
      port: ${DBGUARDIAN_REDIS_PORT:6379}
      password: ${DBGUARDIAN_REDIS_PASSWORD:}
      database: ${DBGUARDIAN_REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 3000ms
          max-idle: 5
          min-idle: 1

logging:
  level:
    root: INFO
    com.dbguardian.test: DEBUG
    io.dbguardian: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
