server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api

logging:
  level:
    io.dbguardian.spring.failover.DataSourceHealthChecker: DEBUG

spring:
  application:
    name: dbguardian-test-java8-sb27-jpa-mariadb
  jpa:
    database-platform: org.hibernate.dialect.MariaDB103Dialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  datasource:
    master:
      url: ${DBGUARDIAN_MARIADB_MASTER_URL:jdbc:mariadb://127.0.0.1:3306/dbguardian?connectTimeout=3000&socketTimeout=5000}
      driver-class-name: org.mariadb.jdbc.Driver
      username: ${DBGUARDIAN_MARIADB_USERNAME:root}
      password: ${DBGUARDIAN_MARIADB_PASSWORD:}
    slave:
      url: ${DBGUARDIAN_MARIADB_SLAVE_URL:jdbc:mariadb://127.0.0.1:3307/dbguardian?connectTimeout=3000&socketTimeout=5000}
      driver-class-name: org.mariadb.jdbc.Driver
      username: ${DBGUARDIAN_MARIADB_USERNAME:root}
      password: ${DBGUARDIAN_MARIADB_PASSWORD:}
    replication:
      master-user: ${DBGUARDIAN_MARIADB_REPLICATION_USER:repl}
      master-password: ${DBGUARDIAN_MARIADB_REPLICATION_PASSWORD:}
      auto-reconnect: true
    recovery:
      enabled: true
      auto-failback: true
      catchup-timeout-seconds: 300
      catchup-check-interval-seconds: 2
    gtid-protection:
      enabled: true
      block-slave-reads-on-risk: true
      max-allowed-lag-seconds: 5
    allow-degraded-startup: true
  redis:
    host: ${DBGUARDIAN_REDIS_HOST:127.0.0.1}
    port: ${DBGUARDIAN_REDIS_PORT:6379}
    password: ${DBGUARDIAN_REDIS_PASSWORD:}
    database: ${DBGUARDIAN_REDIS_DATABASE:0}
    connect-timeout: 1s
    timeout: 1s
